          items:
            $ref: '#/components/schemas/RentRunLineOutput'
          readOnly: true
        total_amount:
          type: number
          format: double
          readOnly: true
        pdf_url:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - commodity_id
      - commodity_name
      - created_at
      - facility_id
      - id
      - lines
      - party_id
      - party_name
      - pdf_url
      - period_end
      - period_start
      - run_date
      - total_amount
      - updated_at
    RentRunPreviewInput:
      type: object
      properties:
        facility_id:
          type: integer
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        party_id:
          type: integer
          nullable: true
        commodity_id:
          type: integer
          nullable: true
        chamber:
          type: string
          default: ''
        min_billing_days:
          type: integer
          minimum: 0
          default: 0
      required:
      - facility_id
      - period_end
      - period_start
    RentRunPreviewLine:
      type: object
      properties:
        lot_id:
          type: integer
        lot_number:
          type: string
        commodity_id:
          type: integer
        commodity_name:
          type: string
        party_id:
          type: integer
        party_name:
          type: string
        qty:
          type: integer
        weight_category:
          type: string
        rate_per_bag_per_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        days_stored:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        rate_source:
          type: string
      required:
      - amount
      - commodity_id
      - commodity_name
      - days_stored
      - lot_id
      - lot_number
      - party_id
      - party_name
      - qty
      - rate_per_bag_per_month
      - rate_source
      - weight_category
    RentRunPreviewOutput:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RentRunPreviewLine'
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        missing_rate_cards:
          type: array
          items:
            $ref: '#/components/schemas/MissingRateCard'
      required:
      - lines
      - missing_rate_cards
      - total_amount
    RoleEnum:
      enum:
      - ADMIN
      type: string
      description: '* `ADMIN` - Admin'
    StatusEnum:
      enum:
      - DRAFT
      - POSTED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `POSTED` - Posted
        * `CANCELLED` - Cancelled
    TypeEnum:
      enum:
      - DEPOSITOR
      - VENDOR
      - TRANSPORTER
      type: string
      description: |-
        * `DEPOSITOR` - Depositor/Customer
        * `VENDOR` - Vendor
        * `TRANSPORTER` - Transporter
    UserCreateInput:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        first_name:
          type: string
          default: ''
          maxLength: 150
        last_name:
          type: string
          default: ''
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: ADMIN
        is_active:
          type: boolean
          default: true
      required:
      - password
      - username
    UserListOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        role:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - role
      - username
    UserUpdateInput:
      type: object
      properties:
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        password:
          type: string
          writeOnly: true
    WeightCategoryEnum:
      enum:
      - KG_20
      - KG_50
      - OTHER
      type: string
      description: |-
        * `KG_20` - 20 kg bag
        * `KG_50` - 50 kg bag
        * `OTHER` - Other
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
