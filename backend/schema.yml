components:
  schemas:
    ChamberInput:
      type: object
      properties:
        facility_id:
          type: integer
        floor_id:
          type: integer
        name:
          type: string
          maxLength: 50
        sort_order:
          type: integer
          default: 0
        capacity_bags:
          type: integer
          nullable: true
        is_active:
          type: boolean
          default: true
      required:
      - facility_id
      - floor_id
      - name
    ChamberOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        floor_id:
          type: integer
          readOnly: true
        floor_name:
          type: string
          readOnly: true
        facility_id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        capacity_bags:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - facility_id
      - floor_id
      - floor_name
      - id
      - name
      - updated_at
    ChamberUpdateInput:
      type: object
      properties:
        floor_id:
          type: integer
        name:
          type: string
          maxLength: 50
        sort_order:
          type: integer
        capacity_bags:
          type: integer
          nullable: true
        is_active:
          type: boolean
    CommodityInput:
      type: object
      properties:
        facility_id:
          type: integer
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 50
        unit:
          type: string
          default: BAGS
          maxLength: 50
        description:
          type: string
          default: ''
          maxLength: 1000
        is_active:
          type: boolean
          default: true
      required:
      - code
      - facility_id
      - name
    CommodityOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        facility_id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 50
        unit:
          type: string
          maxLength: 50
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - facility_id
      - id
      - name
      - updated_at
    CurrentUserOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
