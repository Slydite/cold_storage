openapi: 3.0.3
info:
  title: Cold Storage Management API
  version: 1.0.0
  description: API documentation for the Cold Storage Warehouse Management System.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      summary: Get CSRF token cookie
      tags:
      - auth
      security:
      - cookieAuth: []
      - tokenAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Log in user and establish session
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserOutput'
          description: ''
        '400':
          description: No response body
