version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cold_storage_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cold_storage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cold_storage}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cold_storage_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cold_storage_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  media_data:

networks:
  app-network:
    driver: bridge
